<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2340">
<title>Night Fishing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Mitr:wght@600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--sky:#1B2340;--haze:#2E3A5C;--ink:#0A1A1F;--water:#0E2A33;--water-lit:#1F4A55;--moon:#E8E2C8;--amber:#F2A541;--float:#FF6B3D;--safe:#6CC28A;--warn:#F2C14E;--danger:#E5484D;--paper:#F5F0DF}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sky)}
body{font-family:"IBM Plex Sans","Thonburi","Tahoma",system-ui,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#topbar{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:clamp(16px,2.5vw,40px);right:clamp(16px,2.5vw,40px);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.chip{min-height:36px;display:inline-flex;align-items:center;gap:10px;padding:7px 13px 7px 11px;border:1px solid rgba(232,226,200,.18);border-radius:999px;background:rgba(10,26,31,.58);box-shadow:0 8px 28px rgba(0,0,0,.18);backdrop-filter:blur(10px);font-size:clamp(13px,1.05vw,17px);font-weight:500;white-space:nowrap}
#connection-dot{width:9px;height:9px;flex:0 0 auto;border-radius:50%;background:var(--danger);box-shadow:0 0 0 4px rgba(229,72,77,.15)}
#connection.online #connection-dot{background:var(--safe);box-shadow:0 0 0 4px rgba(108,194,138,.15),0 0 14px rgba(108,194,138,.45)}
#best{opacity:0;transition:opacity .25s ease}
#best.show{opacity:1}
#instruction{position:fixed;z-index:4;top:clamp(76px,10vh,126px);left:50%;width:min(780px,calc(100vw - 40px));transform:translateX(-50%);text-align:center;pointer-events:none;filter:drop-shadow(0 3px 14px rgba(2,10,14,.82));transition:opacity .2s ease,visibility .2s ease}
#eyebrow{min-height:25px;margin-bottom:4px;color:rgba(245,240,223,.76);font-size:clamp(13px,1.25vw,19px);font-weight:500}
#action{margin:0;font-family:"Mitr","Thonburi","Tahoma",system-ui,sans-serif;font-size:clamp(36px,5.4vw,82px);font-weight:600;line-height:1.12;letter-spacing:0;text-wrap:balance;transition:color .18s ease,transform .2s ease}
#action:empty{display:none}
#detail{min-height:34px;margin:6px auto 0;color:rgba(245,240,223,.84);font-size:clamp(17px,1.65vw,27px);line-height:1.55;font-weight:400;text-wrap:balance}
#instruction.warn #action{color:var(--warn)}
#instruction.danger #action{color:var(--danger)}
#instruction.bite #action{animation:stamp .48s cubic-bezier(.16,1.4,.32,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-6deg)}58%{opacity:1;transform:scale(.9) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(-1deg)}}
#offline{position:fixed;z-index:8;inset:0;display:grid;place-items:center;padding:24px;background:rgba(9,22,28,.28);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease;pointer-events:none}
#offline.show{opacity:1;visibility:visible}
body.offline #instruction,body.offline #topbar,body.offline #sound{opacity:0;visibility:hidden}
#offline-card{width:min(550px,calc(100vw - 32px));padding:clamp(24px,4vw,42px);border:1px solid rgba(232,226,200,.24);background:rgba(10,26,31,.92);box-shadow:0 24px 90px rgba(0,0,0,.42);backdrop-filter:blur(16px);text-align:center}
#offline-card h2{margin:0 0 10px;font-family:"Mitr","Thonburi","Tahoma",system-ui,sans-serif;font-size:clamp(28px,4vw,44px);line-height:1.3;font-weight:600}
#offline-card p{margin:0;color:rgba(245,240,223,.8);font-size:clamp(17px,2vw,23px);line-height:1.65}
#offline-card code{color:var(--amber);font:inherit}
#sound{position:fixed;z-index:9;right:clamp(14px,2vw,30px);bottom:max(14px,env(safe-area-inset-bottom));border:1px solid rgba(232,226,200,.24);border-radius:999px;padding:8px 13px;background:rgba(10,26,31,.72);color:rgba(245,240,223,.9);font:500 clamp(12px,1vw,15px)/1.3 "IBM Plex Sans","Thonburi","Tahoma",sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.2);backdrop-filter:blur(8px);cursor:pointer}
#sound:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
#announcer{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:600px){#topbar{top:max(10px,env(safe-area-inset-top));gap:8px}.chip{min-height:31px;padding:5px 9px}#best{max-width:47vw;overflow:hidden;text-overflow:ellipsis}#instruction{top:58px;width:calc(100vw - 24px)}#eyebrow{min-height:20px;margin:0}#action{font-size:clamp(30px,10vw,44px)}#detail{margin-top:2px;font-size:clamp(15px,4.3vw,19px);line-height:1.5}#sound{right:10px;bottom:max(10px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){#instruction.bite #action{animation:none}#action,#best,#offline{transition-duration:.01ms}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<header id="topbar" aria-label="Game status">
  <div id="connection" class="chip" role="status"><span id="connection-dot" aria-hidden="true"></span><span id="connection-text">Waiting for the watch</span></div>
  <div id="best" class="chip"></div>
</header>
<main id="instruction" aria-live="polite" aria-atomic="true">
  <div id="eyebrow">Ready the rod</div>
  <h1 id="action">Raise your wrist</h1>
  <p id="detail">Waiting for the watch to connect</p>
</main>
<section id="offline" class="show" role="alert" aria-live="assertive">
  <div id="offline-card"><h2>No watch yet</h2><p>Start the game with <code>mac/server.py</code><br>then raise your wrist so the watch screen stays on</p></div>
</section>
<button id="sound" type="button" aria-label="Turn on game sound">Tap to turn on sound</button>
<div id="announcer" aria-live="assertive"></div>
<script>
(() => {
'use strict';
const C={sky:'#1B2340',haze:'#2E3A5C',ink:'#0A1A1F',water:'#0E2A33',waterLit:'#1F4A55',moon:'#E8E2C8',amber:'#F2A541',float:'#FF6B3D',safe:'#6CC28A',warn:'#F2C14E',danger:'#E5484D',paper:'#F5F0DF'};
const phases=new Set(['ready','waiting','bite','fighting','caught','lost']);
const cv=document.getElementById('scene'),ctx=cv.getContext('2d',{alpha:false});
const instruction=document.getElementById('instruction'),eyebrow=document.getElementById('eyebrow'),action=document.getElementById('action'),detail=document.getElementById('detail');
const connection=document.getElementById('connection'),connectionText=document.getElementById('connection-text'),offline=document.getElementById('offline'),best=document.getElementById('best'),announcer=document.getElementById('announcer'),soundButton=document.getElementById('sound');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const demo=new URLSearchParams(location.search).get('demo');
const frozenDemo=Boolean(demo&&demo!=='1');
let W=0,H=0,dpr=1,horizon=0,skyGradient,waterGradient,moonGlow,lanternGlow;
let state={phase:'ready',cast:24,dist:24,tension:0,pulling:false,nibbles:0};
let viewDist=24,viewTension=0,lastValidMessage=0,forcedOffline=false,phaseAt=performance.now()/1000,castAnim=null;
let floatX=NaN,floatY=NaN,fishX=NaN,splashAt=-99,nibbleAt=-99,snapAt=-99,landed=true,wasOnline=null,lastFrame=performance.now(),previousReelDist=0,lastReelSound=0,lastCreak=0,lastHud=0;
const particles=[],rings=[],pendingSurfaceEffects=[];

function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';horizon=H*.42;ctx.setTransform(dpr,0,0,dpr,0,0);
 skyGradient=ctx.createLinearGradient(0,0,0,horizon);skyGradient.addColorStop(0,C.sky);skyGradient.addColorStop(.72,'#25304F');skyGradient.addColorStop(1,C.haze);
 waterGradient=ctx.createLinearGradient(0,horizon,0,H);waterGradient.addColorStop(0,C.waterLit);waterGradient.addColorStop(.2,C.water);waterGradient.addColorStop(1,'#071B22');
 moonGlow=ctx.createRadialGradient(W*.77,H*.16,2,W*.77,H*.16,H*.12);moonGlow.addColorStop(0,'rgba(232,226,200,.22)');moonGlow.addColorStop(1,'rgba(232,226,200,0)');
 lanternGlow=ctx.createRadialGradient(W*.105,H*.285,2,W*.105,H*.285,H*.18);lanternGlow.addColorStop(0,'rgba(242,165,65,.25)');lanternGlow.addColorStop(1,'rgba(242,165,65,0)');
}
addEventListener('resize',resize,{passive:true});resize();
const now=()=>performance.now()/1000,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,p)=>a+(b-a)*p;
const easeOut=p=>1-Math.pow(1-clamp(p,0,1),3),easeInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function tensionColor(v){v=clamp(v,0,1);return v<.58?C.safe:v<.82?C.warn:C.danger}
function tensionLabel(v){return v<.58?'Easy':v<.82?'Tight':'About to snap'}
function bestLength(text){const m=String(text||'').match(/(\d+)\s*cm/);return m?Number(m[1]):0}
function lostTitle(reason){reason=String(reason||'');return reason.includes('snapped')?'Line snapped':reason.includes('slow')?'Too slow':reason.includes('scared')?'Fish spooked':'It got away'}

function setCopy(){
 instruction.className='';
 const distance=Math.max(0,Math.round(viewDist||state.dist||state.cast||0));
 switch(state.phase){
  case'ready':eyebrow.textContent='Ready to cast';action.textContent='Flick your wrist forward';detail.textContent='A harder flick sends the float further';break;
  case'waiting':eyebrow.textContent=`Float at ${Math.round(state.cast||0)} m`;action.textContent='Wait for a bite';detail.textContent='A light tap is a nibble. Hold still.';break;
  case'bite':instruction.className='danger bite';eyebrow.textContent='Fish on';action.textContent='Strike!';detail.textContent='Flick your wrist up now';break;
  case'fighting':instruction.className=state.pulling?'warn':'';eyebrow.textContent='To the shore';action.textContent=`${distance} m`;detail.textContent=state.pulling?'Stop reeling, the fish is pulling':'Turn the Digital Crown to reel in';break;
  case'caught':eyebrow.textContent='Landed';action.textContent='';detail.textContent='Flick your wrist to cast again';break;
  case'lost':eyebrow.textContent='Missed';action.textContent=lostTitle(state.reason);detail.replaceChildren(String(state.reason||'The fish pulled the line free.'),document.createElement('br'),'Flick your wrist to cast again');break;
 }
 best.textContent=state.best?`Best: ${state.best}`:'';
 best.classList.toggle('show',Boolean(state.best));announcer.textContent=`${action.textContent} ${detail.textContent}`;
}
function burst(x,y,count,color,power){
 const n=reduced?Math.ceil(count*.35):count;
 for(let i=0;i<n;i++){const a=-Math.PI*(.15+Math.random()*.7),speed=power*(.45+Math.random()*.75);particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:.55+Math.random()*.45,age:0,color,size:1.5+Math.random()*3.2})}
}
function addRing(x,y,strength=1){rings.push({x,y,age:0,life:.85,strength})}
function surfaceEffect(type,options={}){
 const x=options.preferFish&&Number.isFinite(fishX)?fishX:floatX,y=horizon+H*.145,effect={type,...options};
 if(Number.isFinite(x)&&x>0){if(type==='ring')addRing(x,y,options.strength);else burst(x,y,options.count,options.color,options.power)}else pendingSurfaceEffects.push(effect);
}
function flushSurfaceEffects(bobber){
 while(pendingSurfaceEffects.length){const effect=pendingSurfaceEffects.shift(),x=effect.preferFish&&Number.isFinite(fishX)?fishX:bobber.x,y=bobber.waterY;if(effect.type==='ring')addRing(x,y,effect.strength);else burst(x,y,effect.count,effect.color,effect.power)}
}
function onState(next,validMessage=true){
 if(!next||!phases.has(next.phase))return;
 const prev=state,t=now();if(validMessage)lastValidMessage=performance.now();
 if(next.phase!==prev.phase){
  phaseAt=t;instruction.classList.remove('bite');void instruction.offsetWidth;
  if(prev.phase==='ready'&&next.phase==='waiting'){if(frozenDemo){castAnim=null;landed=true}else{castAnim={start:t,duration:reduced?1.05:.92,distance:clamp(next.cast||0,0,50)};landed=false;playSound('cast')}}
  if(next.phase==='bite'){splashAt=t;surfaceEffect('ring',{strength:1.8});surfaceEffect('burst',{count:18,color:'#C9E1DF',power:105});playSound('bite')}
  if(next.phase==='fighting')playSound('hook');
  if(next.phase==='caught'){surfaceEffect('burst',{count:26,color:'#C9E1DF',power:145,preferFish:true});playSound('win')}
  if(next.phase==='lost'){snapAt=t;playSound('lose');if(String(next.reason||'').includes('snapped'))playSound('snap')}
 }
 if(prev.nibbles!==undefined&&Number(next.nibbles)>Number(prev.nibbles||0)){nibbleAt=t;surfaceEffect('ring',{strength:.75});playSound('nibble')}
 if(next.phase==='fighting'&&next.pulling&&!prev.pulling)playSound('pull');
 state={...state,...next};
 if(state.phase==='fighting'&&prev.phase!=='fighting'){viewDist=Number(state.dist||state.cast||25);previousReelDist=viewDist}
 setCopy();
}
function updateConnection(){
 const online=!forcedOffline&&performance.now()-lastValidMessage<2000;
 if(online!==wasOnline){wasOnline=online;connection.classList.toggle('online',online);connectionText.textContent=online?'Watch connected':'Watch disconnected';offline.classList.toggle('show',!online);document.body.classList.toggle('offline',!online);instruction.setAttribute('aria-hidden',String(!online));if(!online)announcer.textContent=''}
}
function connectEvents(){
 const es=new EventSource('/events');
 es.onmessage=event=>{try{const next=JSON.parse(event.data);if(!next.phase)return;onState(next,true)}catch(error){console.warn('Received bad data from the watch',error)}};
}
const frozenStates={
 ready:{phase:'ready',cast:0,dist:0,tension:0,pulling:false,nibbles:0,best:'Nile tilapia 41 cm'},
 waiting:{phase:'waiting',cast:31,dist:31,tension:0,pulling:false,nibbles:2,best:'Nile tilapia 41 cm'},
 bite:{phase:'bite',cast:34,dist:34,tension:.2,pulling:false,nibbles:2,best:'Nile tilapia 41 cm'},
 fighting:{phase:'fighting',cast:38,dist:19,tension:.68,pulling:false,nibbles:2,best:'Nile tilapia 41 cm'},
 caught:{phase:'caught',cast:38,dist:0,tension:0,pulling:false,nibbles:2,fish:'Striped snakehead',cm:52,best:'Nile tilapia 41 cm'},
 lost:{phase:'lost',cast:42,dist:16,tension:1.16,pulling:false,nibbles:1,reason:'Line snapped. You reeled while the fish was pulling.',best:'Nile tilapia 41 cm'}
};
function runDemoLoop(){
 const q=[
 [0,{phase:'ready',cast:0,dist:0,tension:0,pulling:false,nibbles:0,best:'Nile tilapia 41 cm'}],
 [2400,{phase:'waiting',cast:34,dist:34,tension:0,pulling:false,nibbles:0}],
 [3600,{phase:'waiting',cast:34,dist:34,tension:0,pulling:false,nibbles:1}],
 [1500,{phase:'waiting',cast:34,dist:34,tension:0,pulling:false,nibbles:2}],
 [1300,{phase:'bite',cast:34,dist:34,tension:.2,pulling:false,nibbles:2}],
 [1400,{phase:'fighting',cast:34,dist:31,tension:.48,pulling:false,nibbles:2}],
 [1000,{phase:'fighting',dist:27,tension:.71,pulling:false}],[900,{phase:'fighting',dist:25,tension:.86,pulling:true}],
 [1500,{phase:'fighting',dist:24,tension:.63,pulling:false}],[1100,{phase:'fighting',dist:17,tension:.54,pulling:false}],
 [1000,{phase:'fighting',dist:13,tension:.79,pulling:true}],[1300,{phase:'fighting',dist:8,tension:.57,pulling:false}],
 [1200,{phase:'fighting',dist:3,tension:.42,pulling:false}],[900,{phase:'caught',dist:0,tension:0,pulling:false,fish:'Striped snakehead',cm:52,best:'Nile tilapia 41 cm'}],
 [5000,{phase:'ready',cast:0,dist:0,tension:0,pulling:false,nibbles:0,best:'Striped snakehead 52 cm'}],
 [2300,{phase:'waiting',cast:45,dist:45,tension:0,pulling:false,nibbles:0}],[3200,{phase:'waiting',cast:45,dist:45,tension:0,pulling:false,nibbles:1}],
 [1500,{phase:'bite',cast:45,dist:45,tension:.25,pulling:false,nibbles:1}],[1300,{phase:'fighting',dist:39,tension:.67,pulling:false}],
 [1100,{phase:'fighting',dist:35,tension:.93,pulling:true}],[1200,{phase:'fighting',dist:31,tension:1.13,pulling:true}],
 [900,{phase:'lost',dist:31,tension:0,pulling:false,reason:'Line snapped. You reeled while the fish was pulling.'}],[5200,null]
 ];let i=0;
 function step(){const[delay,data]=q[i];setTimeout(()=>{if(data)onState(data,true);i=(i+1)%q.length;step()},delay)}step();
}
function startData(){
 if(demo){lastValidMessage=performance.now();
  if(demo==='offline'){forcedOffline=true;state=frozenStates.ready;setCopy()}
  else if(demo==='1')runDemoLoop();
  else if(frozenStates[demo]){onState(frozenStates[demo],true);setInterval(()=>lastValidMessage=performance.now(),800)}
  else{onState(frozenStates.ready,true);setInterval(()=>lastValidMessage=performance.now(),800)}
 }else connectEvents();
 updateConnection();
}

let audio=null;
soundButton.addEventListener('click',async()=>{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')await audio.resume();soundButton.remove();playSound('nibble')});
function tone(freq,duration,type='sine',volume=.06,endFreq=0,delay=0){
 if(!audio)return;const start=audio.currentTime+delay,o=audio.createOscillator(),gain=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);
 if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),start+duration);gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.001,start+duration);
 o.connect(gain).connect(audio.destination);o.start(start);o.stop(start+duration+.02);
}
function noise(duration,volume,cutoff,delay=0){
 if(!audio)return;const length=Math.ceil(audio.sampleRate*duration),buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();filter.type='lowpass';filter.frequency.value=cutoff;gain.gain.value=volume;source.buffer=buffer;source.connect(filter).connect(gain).connect(audio.destination);source.start(audio.currentTime+delay);
}
function playSound(name){
 if(!audio)return;
 if(name==='cast'){noise(.42,.05,1600);tone(720,.34,'sine',.035,170)}
 if(name==='plop'){tone(150,.18,'sine',.1,72);noise(.18,.07,700)}
 if(name==='nibble')tone(1180,.055,'triangle',.055,900);
 if(name==='bite'){noise(.38,.16,1000);tone(270,.32,'triangle',.11,65)}
 if(name==='hook'){tone(390,.11,'square',.05,760);tone(760,.13,'triangle',.05,980,.09)}
 if(name==='reel')tone(640,.028,'square',.025,480);
 if(name==='pull')tone(155,.28,'sawtooth',.04,105);
 if(name==='creak')tone(118,.2,'sawtooth',.022,82);
 if(name==='snap'){noise(.1,.13,3200);tone(380,.1,'square',.05,95)}
 if(name==='win')[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.075,0,i*.12));
 if(name==='lose')tone(260,.62,'sine',.08,78);
}

function drawSky(t){
 ctx.fillStyle=skyGradient;ctx.fillRect(0,0,W,horizon+1);ctx.fillStyle=moonGlow;ctx.fillRect(0,0,W,horizon);
 const mx=W*.77,my=H*.16,mr=clamp(H*.046,25,62);ctx.fillStyle=C.moon;ctx.beginPath();ctx.arc(mx,my,Math.max(0,mr),0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(46,58,92,.18)';ctx.beginPath();ctx.arc(mx-mr*.25,my-mr*.12,Math.max(0,mr*.18),0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(mx+mr*.28,my+mr*.25,Math.max(0,mr*.12),0,Math.PI*2);ctx.fill();
 drawTreeline(t);
}
function drawTreeline(t){
 ctx.fillStyle=C.ink;ctx.beginPath();ctx.moveTo(0,horizon+3);
 for(let x=0;x<=W;x+=18){const y=horizon-13-8*Math.sin(x*.027)-5*Math.sin(x*.071+1.5);ctx.lineTo(x,y)}
 ctx.lineTo(W,horizon+12);ctx.lineTo(0,horizon+12);ctx.fill();
 const base=horizon+H*.04;ctx.strokeStyle=C.ink;ctx.lineWidth=2;
 for(let side=0;side<2;side++){const start=side?W-Math.min(170,W*.2):0;for(let i=0;i<13;i++){const x=start+i*(side?12:9),h=28+(i*17%54);ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+Math.sin(t*.35+i)*4,base-h*.55,x+3,base-h);ctx.stroke();if(i%3===0){ctx.fillStyle=C.ink;ctx.beginPath();ctx.ellipse(x+3,base-h+4,Math.max(0,3),Math.max(0,9),-.12,0,Math.PI*2);ctx.fill()}}}
 for(let i=0;i<7;i++){const x=W*(.035+i*.023),y=horizon-H*(.045+(i%3)*.035),blink=Math.pow(Math.max(0,Math.sin(t*(.7+i*.05)+i*1.9)),6);ctx.fillStyle=`rgba(242,193,78,${blink*.8})`;ctx.beginPath();ctx.arc(x,y,Math.max(0,1.6+blink*2.2),0,Math.PI*2);ctx.fill()}
}
function drawWater(t){

 const t=timestamp/1000,dt=Math.max(0,Math.min(.035,(timestamp-lastFrame)/1000||.016));lastFrame=timestamp;const smoothing=1-Math.pow(.001,dt);viewDist+=(Number(state.dist??state.cast??0)-viewDist)*smoothing*.22;viewTension+=(Number(state.tension||0)-viewTension)*smoothing*.3;
 if(state.phase==='fighting'&&!state.pulling&&viewDist<previousReelDist-.045&&t-lastReelSound>.095){previousReelDist=viewDist;lastReelSound=t;playSound('reel')}else if(viewDist>previousReelDist)previousReelDist=viewDist;
 updateConnection();if(state.phase==='fighting'&&t-lastHud>.1){lastHud=t;setCopy()}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const biteShake=state.phase==='bite'&&t-phaseAt<.42&&!reduced;if(biteShake){const power=(1-(t-phaseAt)/.42)*8;ctx.save();ctx.translate(Math.sin(t*89)*power,Math.cos(t*73)*power*.55)}
 drawSky(t);drawWater(t);const sala=drawSala(),rod=rodGeometry(sala.hand,t),bobber=floatPosition(t,rod.tip);floatX=bobber.x;floatY=bobber.y;flushSurfaceEffects(bobber);drawLine(t,rod.tip,bobber);drawFloat(t,bobber);if(state.phase==='fighting')drawFighting(t,bobber,rod);if(state.phase==='caught')drawCatch(t);if(state.phase==='lost')drawLost(t,bobber);updateParticles(dt);if(biteShake)ctx.restore();requestAnimationFrame(frame);
}
setCopy();startData();requestAnimationFrame(frame);
})();
